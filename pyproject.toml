[project]
name = "ai-engineer"
version = "0.1.0"
description = "Self-study repo: 6-month path to production AI Engineer. Infrastructure + exercise specs; the learner writes the deep learning code."
readme = "README.md"
requires-python = ">=3.11"

# Runtime dependencies. CPU-only torch is the default (see SETUP.md for CUDA).
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "mlflow>=2.11",
    "jupyterlab>=4.1",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "nbstripout>=0.7",
    "pre-commit>=3.7",
]

[tool.uv]
# Keep the resolution reproducible across the two machines.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks", "data/raw"]

[tool.ruff.lint]
# Boring, beginner-readable defaults: pyflakes + pycodestyle + isort + pyupgrade + bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, don't fail lint on it
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
